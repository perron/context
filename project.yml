name: Context
options:
  bundleIdPrefix: com.karlperron
  deploymentTarget:
    iOS: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.44.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  BrowserKit:
    path: packages/BrowserKit
  SearchKit:
    path: packages/SearchKit

targets:
  Context:
    type: application
    platform: iOS
    sources:
      - path: app/Sources
      - path: app/Resources
    dependencies:
      - package: BrowserKit
      - package: SearchKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karlperron.contextbrowser
        PRODUCT_NAME: Context
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Context
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Context lets websites you choose use the camera for calls, scanning, and media capture.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Context lets websites you choose use the microphone for voice input, calls, and media capture.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      gatherCoverageData: true
      testTargets:
        - ContextTests
        - ContextUITests

  ContextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: app/Tests
        excludes:
          - ContextUITests.swift
    dependencies:
      - target: Context
      - package: BrowserKit
      - package: SearchKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karlperron.contextbrowser.tests
        GENERATE_INFOPLIST_FILE: YES

  ContextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: app/Tests/ContextUITests.swift
    dependencies:
      - target: Context
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karlperron.contextbrowser.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Context
