name: Update content rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Propose current EasyList rules
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and compile rules
        run: ./scripts/update-content-rules.sh
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/content-rules"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add app/Resources/ContentRules third-party/easylist
          git commit -m "chore: update content rules"
          git push --force-with-lease origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "chore: update content rules" \
              --body "Automated EasyList and EasyPrivacy refresh. Review source metadata and CI before merging."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update content rules" \
              --body "Automated EasyList and EasyPrivacy refresh. Review source metadata and CI before merging."
          fi
