name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./scripts/bootstrap.sh
      - name: Type-check platform sources
        run: ./scripts/typecheck-platforms.sh
      - name: Build iOS app
        run: |
          xcodebuild \
            -project Context.xcodeproj \
            -scheme Context \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
  unit-tests:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Test packages
        run: |
          for package in BrowserKit SearchKit; do
            swift test --disable-sandbox --package-path "packages/$package"
          done

  lint:
    name: SwiftLint and license headers
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Check license headers
        run: ./scripts/check-licenses.sh
      - name: Lint
        run: swiftlint lint --strict
