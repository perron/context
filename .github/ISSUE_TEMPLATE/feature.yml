name: Feature
description: Propose a focused product change
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not an implementation.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Recommended change
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
