strict: true
included:
  - app
  - packages/BrowserKit
  - packages/SearchKit
excluded:
  - packages/BrowserKit/.build
  - packages/BrowserKit/.swiftpm
  - packages/SearchKit/.build
  - packages/SearchKit/.swiftpm
  - DerivedData
line_length:
  warning: 120
  error: 140
identifier_name:
  min_length:
    warning: 2
type_body_length:
  warning: 300
file_length:
  warning: 500
reporter: xcode
